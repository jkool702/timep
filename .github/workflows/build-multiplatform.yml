name: Build timep.so (multiarch) and update base64 in timep.bash

on:
  push:
    paths:
      - 'LIB/LOADABLES/SRC/timep.c'
  workflow_dispatch:

jobs:
  build:
    name: Build timep.so (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
            docker_image: fedora:latest
            gcc_flags: "-msse4.2"
          - arch: aarch64
            platform: linux/arm64
            docker_image: fedora:latest
            gcc_flags: "-march=armv8-a+crc"
          - arch: ppc64le
            platform: linux/ppc64le
            docker_image: fedora:latest
            gcc_flags: ""
          - arch: s390x
            platform: linux/s390x
            docker_image: fedora:latest
            gcc_flags: ""
          - arch: armv7
            platform: linux/arm/v7
            docker_image: arm32v7/fedora:latest
            gcc_flags: ""
          - arch: riscv64
            platform: linux/riscv64
            docker_image: fedorariscv/base:latest
            gcc_flags: ""
#          - arch: i686
#            platform: linux/i686
#            docker_image: nickcis/fedora-32:latest
#            gcc_flags: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build timep.so in Docker (${{ matrix.arch }})
        run: |
          set -e
          mkdir -p LIB/LOADABLES/BIN/${{ matrix.arch }}
          cp LIB/LOADABLES/SRC/timep.c .
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            --platform=${{ matrix.platform }} \
            ${{ matrix.docker_image }} \
            bash -c "
              (dnf install -y gcc make bash-devel) && \
              gcc -Wall -fPIC -flto -O3 ${{ matrix.gcc_flags }} -v -DSHELL -DLOADABLE_BUILTIN -DHAVE_CONFIG_H -DSELECT_COMMAND \
                -I/usr/include -I/usr/include/bash -I/usr/include/bash/builtins -I/usr/include/bash/include \
                -shared -o LIB/LOADABLES/BIN/${{ matrix.arch }}/timep.so timep.c
            "
      - name: Upload timep.so artifact
        uses: actions/upload-artifact@v4
        with:
          name: timep.so-${{ matrix.arch }}
          path: LIB/LOADABLES/BIN/${{ matrix.arch }}/timep.so

  base64:
    name: Base64 encode all timep.so files and update timep.bash
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Download all timep.so artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move all timep.so files to expected locations
        run: |
          set -e
          for artifact_dir in artifacts/timep.so-*; do
            arch=$(basename "$artifact_dir" | sed 's/timep.so-//')
            mkdir -p LIB/LOADABLES/BIN/$arch
            mv "$artifact_dir"/timep.so "LIB/LOADABLES/BIN/$arch/timep.so"
          done

      - name: Extract _timep_file_to_base64 from timep.bash (for workflow use only)
        run: |
          mkdir -p LIB
          awk '/^_timep_file_to_base64[[:space:]]*\(\)/{flag=1} flag; /^}/&&flag{flag=0}' timep.bash > LIB/_timep_file_to_base64.func

      - name: Update base64 case block in timep.bash
        shell: bash
        run: |
          source LIB/_timep_file_to_base64.func

          gen_base64_block() {
            echo "######## BEGIN BASE64 ENCODED TIMEP.SO FILES ########"
            echo "# +++++++++++++++++++++++++++++++++++++++++++++++++ #"
            for arch in x86_64 $(ls LIB/LOADABLES/BIN | grep -v x86_64 | sort); do
              sofile="LIB/LOADABLES/BIN/$arch/timep.so"
              [ -f "$sofile" ] || continue
              b64=$(_timep_file_to_base64 -q "$sofile")
              echo
              echo "'$arch')"
              echo "b64=$b64"
              echo ";;"
            done
            echo
            echo "# ------------------------------------------------- #"
            echo "######### END BASE64 ENCODED TIMEP.SO FILES #########"
          }

          gen_base64_block > new_block.txt

          awk '
            BEGIN { copying=1 }
            /^######## BEGIN BASE64 ENCODED TIMEP.SO FILES ########/ {
              copying=0; while((getline l < "new_block.txt") > 0) print l; skip=1; next
            }
            /^######### END BASE64 ENCODED TIMEP.SO FILES #########/ && skip { copying=1; next }
            copying
          ' timep.bash > timep.bash.new && \mv timep.bash.new timep.bash

      - name: Clean up workflow temp files
        run: |
          rm -f new_block.txt LIB/_timep_file_to_base64.func

      - name: Configure git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create update branch and push changes
        id: push_branch
        run: |
          BASE_BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          UPDATE_BRANCH="update/timep-binaries-${BASE_BRANCH}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$UPDATE_BRANCH"
          git add -f -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "branch=" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m 'Update timep.so for all architectures and refresh base64 in timep.bash'
          git push origin "$UPDATE_BRANCH"
          echo "branch=$UPDATE_BRANCH" >> $GITHUB_OUTPUT
          echo "base_branch=$BASE_BRANCH" >> $GITHUB_OUTPUT


